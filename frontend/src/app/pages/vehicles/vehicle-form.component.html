<div class="page">
  <header class="topbar">
    <a routerLink="/dashboard" class="link-btn">← Volver</a>
    <h1>Nuevo vehículo</h1>
  </header>

  <main class="content narrow">
    <form [formGroup]="form" (ngSubmit)="submit()" class="card-form">
      <div class="field">
        <label>Placa</label>
        <input type="text" formControlName="placa" placeholder="ABC123"
               [class.invalid]="f['placa'].invalid && f['placa'].touched" />
      </div>
      <div class="field">
        <label>Marca</label>
        <input type="text" formControlName="marca" placeholder="Mazda" />
      </div>
      <div class="field">
        <label>Modelo</label>
        <input type="text" formControlName="modelo" placeholder="3" />
      </div>
      <div class="field">
        <label>Año</label>
        <input type="number" formControlName="anio" placeholder="2020" />
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button type="submit" [disabled]="loading">{{ loading ? 'Guardando...' : 'Guardar vehículo' }}</button>
    </form>
  </main>
</div>
